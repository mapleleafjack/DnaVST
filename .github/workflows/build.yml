name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/CPM
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cmake --build build --config Release --parallel
    
    - name: List artifacts
      run: |
        ls -la build/DNAVisualiser_artefacts/Release/
    
    - name: Upload DNAVisualiser artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DNAVisualiser-macOS
        path: |
          build/DNAVisualiser_artefacts/Release/VST3/*.vst3
          build/DNAVisualiser_artefacts/Release/AU/*.component
          build/DNAVisualiser_artefacts/Release/Standalone/*.app
        if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/CPM
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cmake --build build --config Release --parallel
    
    - name: List artifacts
      run: |
        dir build\DNAVisualiser_artefacts\Release\
    
    - name: Upload DNAVisualiser artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DNAVisualiser-Windows
        path: |
          build/DNAVisualiser_artefacts/Release/VST3/*.vst3
          build/DNAVisualiser_artefacts/Release/Standalone/*.exe
        if-no-files-found: warn

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev \
          mesa-common-dev
    
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/CPM
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cmake --build build --config Release --parallel
    
    - name: List artifacts
      run: |
        ls -la build/DNAVisualiser_artefacts/Release/
    
    - name: Upload DNAVisualiser artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DNAVisualiser-Linux
        path: |
          build/DNAVisualiser_artefacts/Release/VST3/*.vst3
          build/DNAVisualiser_artefacts/Release/Standalone/*
        if-no-files-found: warn
